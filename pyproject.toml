[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainpulse"
version = "0.1.0"
description = "Multi-chain gas, block, and activity dashboard for EVM L2s. Public RPCs, no API key, one CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rhardian" }]
requires-python = ">=3.10"
keywords = ["ethereum", "l2", "gas", "rpc", "cli", "dashboard", "evm", "arbitrum", "base", "optimism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.7,<15.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
chainpulse = "chainpulse.cli:app"

[project.urls]
Homepage = "https://github.com/rhardian/chainpulse"
Issues = "https://github.com/rhardian/chainpulse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chainpulse"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
